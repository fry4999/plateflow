<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">plateflow social preview</title>
  <desc id="desc">Dark plateflow card showing FRC CAD, inventory, procurement, and manufacturing status.</desc>
  <defs>
    <radialGradient id="glowBlue" cx="35%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".52"/>
      <stop offset="42%" stop-color="#2563eb" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="86%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity=".42"/>
      <stop offset="46%" stop-color="#60a5fa" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotGrid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.1" fill="#60a5fa" opacity=".22"/>
    </pattern>
    <linearGradient id="plateFill" x1="0" x2="1">
      <stop offset="0%" stop-color="#12203a"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowCyan)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)" opacity=".92"/>

  <g filter="url(#softShadow)">
    <rect x="70" y="68" width="1060" height="494" rx="34" fill="#07080c" stroke="#1f2937" stroke-width="2"/>
    <rect x="70" y="68" width="1060" height="494" rx="34" fill="none" stroke="#2563eb" stroke-opacity=".28" stroke-width="3"/>
  </g>

  <g transform="translate(112 110)">
    <rect width="88" height="88" rx="22" fill="url(#markFill)"/>
    <path d="M28 32 H57 C70 32 78 40 78 52 C78 64 69 72 56 72 H45 V58 H56 C61 58 64 56 64 52 C64 48 61 46 56 46 H42 V78 H28 V32 Z" fill="#07080c"/>
  </g>

  <text x="226" y="150" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="0">plateflow</text>
  <text x="226" y="194" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="650">FRC build operations from CAD to the shop floor</text>

  <g transform="translate(112 254)">
    <rect x="0" y="0" width="310" height="142" rx="18" fill="#0f172a" stroke="#60a5fa" stroke-opacity=".7" stroke-width="2"/>
    <rect x="26" y="28" width="108" height="48" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
    <rect x="152" y="28" width="132" height="48" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="26" y="92" width="258" height="16" rx="8" fill="#111827"/>
    <rect x="26" y="92" width="174" height="16" rx="8" fill="#2563eb"/>
    <text x="26" y="128" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="750">Onshape sync</text>
  </g>

  <g transform="translate(446 254)">
    <rect x="0" y="0" width="310" height="142" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="24" y="48" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="45" font-weight="850">127</text>
    <text x="118" y="48" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">parts tracked</text>
    <text x="24" y="91" fill="#22c55e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="850">inventory</text>
    <text x="24" y="122" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">stock, reserved, needed</text>
  </g>

  <g transform="translate(780 254)">
    <rect x="0" y="0" width="310" height="142" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <path d="M32 98 A44 44 0 1 1 112 72" fill="none" stroke="#1f2937" stroke-width="16" stroke-linecap="round"/>
    <path d="M32 98 A44 44 0 0 1 112 72" fill="none" stroke="#22c55e" stroke-width="16" stroke-linecap="round"/>
    <text x="150" y="58" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="850">ready</text>
    <text x="150" y="95" fill="#a1a1aa" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">procurement + fab</text>
  </g>

  <g transform="translate(112 436)">
    <rect width="196" height="52" rx="26" fill="#102a56" stroke="#2563eb" stroke-opacity=".8"/>
    <text x="24" y="34" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Procurement</text>
  </g>
  <g transform="translate(328 436)">
    <rect width="222" height="52" rx="26" fill="#172012" stroke="#22c55e" stroke-opacity=".75"/>
    <text x="24" y="34" fill="#dcfce7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Manufacturing</text>
  </g>
  <g transform="translate(570 436)">
    <rect width="174" height="52" rx="26" fill="#271a0b" stroke="#f59e0b" stroke-opacity=".78"/>
    <text x="24" y="34" fill="#fef3c7" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800">Inventory</text>
  </g>

  <text x="112" y="530" fill="#71717a" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">teknik-engineering.com</text>
</svg>
